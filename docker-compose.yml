services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bilanco
      POSTGRES_PASSWORD: bilanco
      POSTGRES_DB: bilanco
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilanco"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://bilanco:bilanco@db:5432/bilanco
      REDIS_URL: redis://redis:6379/0
    volumes:
      - rawdata:/app/data/raw
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m app.cli init-db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://bilanco:bilanco@db:5432/bilanco
      REDIS_URL: redis://redis:6379/0
      SCHEDULER_ENABLED: "true"
    volumes:
      - rawdata:/app/data/raw
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.scheduler.jobs

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  rawdata:
