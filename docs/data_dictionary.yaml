# 7.10 Vade — kaynağın gerçek kovaları korunur; 3-12 ay yapay bölünmez.
maturity:
  buckets_target: [demand, 0_1m, 1_3m, 3_6m, 6_12m]
  # TBB DT20/DT21 "Aktif ve Pasif Kalemlerin Kalan Vadelerine Göre Gösterimi" gerçek kovaları (Haziran 2023 dosyasından doğrulandı):
  buckets_tbb_remaining_maturity: [demand, 0_1m, 1_3m, 3_12m, 1_5y, over_5y, unallocated, total]
  # DT20 'Mevd.Vade' (Haziran 2026, doğrulandı): mevduat türü × [demand_7d (Vadesiz + 7 Gün İhbarlı), 0_1m, 1_3m, over_3m (3 Ay ve Üstü), total]
  buckets_dt20_deposit_type: [demand_7d, 0_1m, 1_3m, over_3m, total]
  # Banka kitabı dipnotu 'pasif1 / 2.a.1.i Mevduatın vade yapısı' (Haziran 2026, doğrulandı): 3-6 ay ve 6 ay-1 yıl AYRI
  buckets_deposit_footnote: [demand, notice_7d, 0_1m, 1_3m, 3_6m, 6_12m, over_1y, accumulating, total]
  # Banka kitabı dipnotu 'malibünye1 / Aktif ve Pasif Kalemlerin Kalan Vadelerine Göre Gösterimi' (doğrulandı): Verilen Krediler ve Diğer Mevduat satırları
  buckets_bank_workbook_remaining: [demand, 0_1m, 1_3m, 3_12m, 1_5y, over_5y, unallocated, total]
  items:
    - {code: total_assets, name_tr: Toplam aktifler (kalan vade), basis: remaining}
    - {code: total_liabilities, name_tr: Toplam pasifler (kalan vade), basis: remaining}
    - {code: liquidity_gap, name_tr: Likidite açığı, basis: remaining}
    - {code: loans, name_tr: Krediler, basis: remaining}
    - {code: deposits, name_tr: Mevduat, basis: remaining}
    - {code: loans_original, name_tr: Krediler (orijinal vade — kısa / orta-uzun), basis: original}

derived:
  - {code: roa, name_tr: Aktif kârlılığı, formula: "net_profit_annualized / avg(total_assets)", unit: pct}
  - {code: roe, name_tr: Özkaynak kârlılığı, formula: "net_profit_annualized / avg(total_equity)", unit: pct}
  - {code: nim, name_tr: Net faiz marjı, formula: "net_interest_income_annualized / avg(interest_earning_assets)", unit: pct, note: "faiz getirili aktif proxysi açıkça belirtilir"}
  - {code: cost_to_income, name_tr: Gider/Gelir, formula: "operating_expenses / (net_interest_income + net_fee_commission_income + trading_income + other_operating_income)", unit: pct}
  - {code: npl_ratio, name_tr: Takip oranı, formula: "npl_amount / loans_gross", unit: pct}
  - {code: npl_coverage_ratio, name_tr: Karşılık oranı, formula: "loan_loss_provisions / npl_amount", unit: pct}
  - {code: cost_of_risk, name_tr: Kredi risk maliyeti, formula: "provision_expenses_annualized / avg(loans_gross)", unit: pct}
  - {code: equity_to_assets, name_tr: Özkaynak/Aktif, formula: "total_equity / total_assets", unit: pct}
  - {code: loan_to_deposit_ratio, name_tr: Kredi/Mevduat, formula: "loans_gross / total_deposits", unit: pct}
  - {code: liquid_assets_ratio, name_tr: Likit aktif/Aktif, formula: "(cash_and_cash_equivalents + balances_with_central_bank) / total_assets", unit: pct}
  - {code: cash_to_assets, name_tr: Nakit/Aktif, formula: "cash_and_cash_equivalents / total_assets", unit: pct}
  - {code: assets_per_employee, formula: "total_assets / employee_count", unit: TRY}
  - {code: profit_per_employee, formula: "net_profit / employee_count", unit: TRY}
  - {code: deposits_per_branch, formula: "total_deposits / branch_count", unit: TRY}
  - {code: loans_per_branch, formula: "loans_gross / branch_count", unit: TRY}
  - {code: loan_deposit_spread_tl, formula: "loan_interest_tl - deposit_interest_tl", unit: pct, requires_same_definition: true}
  - {code: loan_deposit_spread_usd, formula: "loan_interest_usd - deposit_interest_usd", unit: pct, requires_same_definition: true}
  - {code: loan_deposit_spread_eur, formula: "loan_interest_eur - deposit_interest_eur", unit: pct, requires_same_definition: true}
  - {code: assets_growth_qoq, formula: "total_assets[t] / total_assets[t-1q] - 1", unit: pct, method: stock}
  - {code: assets_growth_yoy, formula: "total_assets[t] / total_assets[t-4q] - 1", unit: pct, method: stock}
  - {code: loans_growth_qoq, formula: "loans_gross[t] / loans_gross[t-1q] - 1", unit: pct, method: stock}
  - {code: loans_growth_yoy, formula: "loans_gross[t] / loans_gross[t-4q] - 1", unit: pct, method: stock}
  - {code: deposits_growth_qoq, formula: "total_deposits[t] / total_deposits[t-1q] - 1", unit: pct, method: stock}
  - {code: deposits_growth_yoy, formula: "total_deposits[t] / total_deposits[t-4q] - 1", unit: pct, method: stock}
  - {code: equity_growth_yoy, formula: "total_equity[t] / total_equity[t-4q] - 1", unit: pct, method: stock}
  - {code: profit_growth_yoy, formula: "net_profit_ytd[t] / net_profit_ytd[t-4q] - 1", unit: pct, method: flow_same_ytd_window}

macro:
  # EVDS seri kodları TAHMİN EDİLMEZ: evds adapter 'series_catalog' çağrısıyla kodu doğrulayıp evds_series_code alanına yazar.
  - {code: usd_try, name_tr: USD/TRY, frequency: daily, evds_series_code: null}
  - {code: eur_try, name_tr: EUR/TRY, frequency: daily, evds_series_code: null}
  - {code: policy_rate, name_tr: TCMB politika faizi, frequency: daily, evds_series_code: null}
  - {code: cpi, name_tr: TÜFE endeksi, frequency: monthly, evds_series_code: null}
  - {code: inflation_yoy, name_tr: Yıllık enflasyon, frequency: monthly, evds_series_code: null}
  - {code: inflation_mom, name_tr: Aylık enflasyon, frequency: monthly, evds_series_code: null}
  - {code: deposit_rate_tl, name_tr: Sektör TL mevduat faizi (yeni açılış, ağırlıklı ort.), frequency: weekly, evds_series_code: null, rate_definition: new_business_flow_rate}
  - {code: loan_rate_tl, name_tr: Sektör TL kredi faizi (yeni açılış, ağırlıklı ort.), frequency: weekly, evds_series_code: null, rate_definition: new_business_flow_rate}
  - {code: government_bond_yield, name_tr: DİBS getirisi, frequency: daily, evds_series_code: null}
